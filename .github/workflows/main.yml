name: generate animation

on:
  # Executa automaticamente a cada 24 horas
  schedule:
    - cron: "0 * * * *"
  
  # Permite execução manual a qualquer momento
  workflow_dispatch:
  
  # Executa a cada push na branch main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Gera o jogo da cobrinha com as cores personalizadas extraídas do seu gráfico
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-custom-dark.svg?color_snake=#616100&color_dots=#121200,#333300,#666600,#999900,#ffffaf
          
      # Envia os arquivos gerados para a branch 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
