name: generate animation

on:
  # Executa automaticamente a cada 15 minutos (minimo permitido pelo GitHub e 5min,
  # 15min da uma margem segura contra atrasos/skips em horarios de pico)
  schedule:
    - cron: "*/15 * * * *"
  
  # Permite execução manual a qualquer momento
  workflow_dispatch:
  
  # Executa a cada push na branch main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Gera o jogo da cobrinha na mesma paleta monocromática do retrato ASCII e dos gráficos de stats
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#424a53&color_dots=#d8dee4,#8c959f,#6e7681,#424a53
            dist/github-snake-custom-dark.svg?color_snake=#f0f6fc&color_dots=#30363d,#8b949e,#c9d1d9,#f0f6fc
          
      # Envia os arquivos gerados para a branch 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
