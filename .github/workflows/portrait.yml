name: refresh portrait

# Regenerates ascii.svg from the current GitHub avatar. The crop below was
# hand-tuned for this specific photo (centered face, no black blazer/collar) --
# if the avatar framing changes, run manually with a different "crop" value
# (Actions > refresh portrait > Run workflow).
on:
  schedule:
    - cron: "26 6 * * *"
  workflow_dispatch:
    inputs:
      crop:
        description: "left,top,right,bottom (pixels in the original avatar)"
        required: false
        # Include the full chin; the avatar's jaw reaches roughly y=405.
        default: "60,10,420,420"

permissions:
  contents: write

concurrency:
  group: refresh-portrait
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # rembg (u2net model, ~176MB) downloads on the first run; caching avoids
      # repeating that download on every daily run.
      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/rembg
          key: u2net-model-v1

      - name: Install dependencies
        run: uv pip install --system --quiet pillow numpy opencv-python-headless rembg onnxruntime

      - name: Download current avatar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          avatar_url=$(gh api "users/${{ github.repository_owner }}" --jq .avatar_url)
          curl -sL "${avatar_url}&s=800" -o /tmp/avatar.png

      - name: Generate ASCII portrait
        env:
          CROP: ${{ github.event.inputs.crop || '60,10,420,420' }}
        run: |
          python3 scripts/make_portrait.py /tmp/avatar.png ascii.svg --crop "$CROP"
          python3 scripts/embed_portrait_font.py

      - name: Commit whatever changed
        run: |
          if [ -z "$(git status --porcelain -- ascii.svg)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascii.svg
          git commit -m "portrait: refresh ascii.svg from current avatar"
          git push
